name: Daily Virtual Lab Release

on:
  schedule:
    # Triggers every day at 05:30 UTC (11:00 AM IST)
    # Runs completely on GitHub's cloud servers — no laptop needed!
    - cron: '30 5 * * *'
  workflow_dispatch: # Allows manual one-click trigger from phone or browser anytime

permissions:
  contents: write

jobs:
  release-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Fetch unreleased branch containing queued labs
        run: |
          git fetch origin unreleased:unreleased || true

      - name: Execute daily lab release runner
        id: lab_step
        env:
          SOURCE_BRANCH: unreleased
        run: |
          node .github/scripts/release_next_lab.js

      - name: Commit and push released lab to staging
        if: steps.lab_step.outputs.released == 'true'
        run: |
          git config user.name "Chandan Raj"
          git config user.email "rajchandan02468@gmail.com"
          git add -A
          git commit -m "${{ steps.lab_step.outputs.commit_msg }}"
          git push origin staging

      - name: Synchronize queue status with unreleased branch
        if: steps.lab_step.outputs.released == 'true'
        run: |
          git checkout unreleased || true
          git checkout staging -- .github/daily_queue.json
          git config user.name "Chandan Raj"
          git config user.email "rajchandan02468@gmail.com"
          git add .github/daily_queue.json
          git commit -m "chore(queue): sync release status for daily batch (${{ steps.lab_step.outputs.batch_count }} labs)" || true
          git push origin unreleased || true
