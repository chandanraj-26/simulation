name: Daily Virtual Lab Release

on:
  schedule:
    # Triggers every day at 10:30 UTC (4:00 PM IST)
    # Runs completely on GitHub's cloud servers — no laptop needed!
    - cron: '30 10 * * *'
  workflow_dispatch: # Allows manual one-click trigger from phone or browser anytime

permissions:
  contents: write

jobs:
  release-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch staging branch containing pre-built labs
        run: |
          git fetch origin staging:staging

      - name: Execute daily lab release runner
        id: lab_step
        run: |
          node .github/scripts/release_next_lab.js

      - name: Commit and push released lab to main
        if: steps.lab_step.outputs.released == 'true'
        run: |
          git config user.name "Chandan Raj"
          git config user.email "rajchandan02468@gmail.com"
          git add -A
          git commit -m "${{ steps.lab_step.outputs.commit_msg }}"
          git push origin main

      - name: Synchronize queue status with staging branch
        if: steps.lab_step.outputs.released == 'true'
        run: |
          git checkout staging
          git checkout main -- .github/daily_queue.json
          git config user.name "Chandan Raj"
          git config user.email "rajchandan02468@gmail.com"
          git add .github/daily_queue.json
          git commit -m "chore(queue): sync release status for ${{ steps.lab_step.outputs.lab_id }}" || true
          git push origin staging
